<div id="app-root"></div>
<style>
  :root{
    --ink:#121212;
    --canvas:#1c1b19;
    --canvas-raised:#26241f;
    --paper:#efe9dd;
    --paper-dim:#b9b2a1;
    --crimson:#c4321f;
    --crimson-dim:#8f2516;
    --gold:#d8a440;
    --line: rgba(239,233,221,0.12);
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  * { box-sizing: border-box; }
  #app-root{
    background: var(--canvas);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100%;
    padding: 0;
    position: relative;
  }
  .wrap{ max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

  /* ---- Header ---- */
  .masthead{
    border-bottom: 3px solid var(--crimson);
    padding-bottom: 18px;
    margin-bottom: 22px;
    position: relative;
  }
  .masthead .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }
  .masthead h1{
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(28px, 6vw, 40px);
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 0.95;
  }
  .masthead .sub{
    color: var(--paper-dim);
    font-size: 13px;
    margin-top: 8px;
  }

  /* ---- Tabs (séances) ---- */
  .btn-export{
    background: none;
    border: 1px solid var(--line);
    color: var(--paper-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-export:hover{ border-color: var(--gold); color: var(--gold); }

  .tabs{
    display:flex;
    gap: 2px;
    margin-bottom: 22px;
    background: var(--ink);
    border-radius: 6px;
    padding: 4px;
  }
  .tab{
    flex: 1;
    text-align:center;
    padding: 11px 6px;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--paper-dim);
    transition: background .15s ease, color .15s ease;
    user-select: none;
  }
  .tab.active{
    background: var(--crimson);
    color: var(--paper);
  }
  .tab:not(.active):hover{ color: var(--paper); }

  /* ---- Session meta ---- */
  .session-meta{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .session-meta h2{
    font-family: var(--font-display);
    text-transform: uppercase;
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .session-count{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--gold);
  }

  /* ---- Exercise card ---- */
  .exo-card{
    background: var(--canvas-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--crimson-dim);
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .exo-head{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    gap: 10px;
  }
  .exo-name{
    font-family: var(--font-display);
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .exo-target{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    margin-top: 2px;
  }
  .exo-last{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--gold);
    white-space: nowrap;
  }
  .chevron{
    color: var(--paper-dim);
    transition: transform .15s ease;
    flex-shrink:0;
  }
  .exo-card.open .chevron{ transform: rotate(180deg); }

  .exo-body{
    display:none;
    padding: 0 16px 16px;
    border-top: 1px solid var(--line);
  }
  .exo-card.open .exo-body{ display:block; }

  .log-form{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 14px 0 10px;
  }
  .log-form .full{ grid-column: 1 / -1; }
  .field label{
    display:block;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--paper-dim);
    margin-bottom: 4px;
  }
  .field input, .field textarea{
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 4px;
    padding: 8px 9px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .field input:focus, .field textarea:focus{
    outline: none;
    border-color: var(--crimson);
  }
  .field textarea{ resize: vertical; min-height: 36px; }

  .btn-save{
    background: var(--crimson);
    color: var(--paper);
    border: none;
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: background .15s ease;
  }
  .btn-save:hover{ background: var(--crimson-dim); }
  .btn-save:disabled{ opacity: 0.4; cursor: default; }

  .history{
    margin-top: 14px;
    border-top: 1px dashed var(--line);
    padding-top: 10px;
  }
  .history-title{
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--paper-dim);
    margin-bottom: 8px;
  }
  .history-row{
    display:flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    gap: 10px;
  }
  .history-row:last-child{ border-bottom: none; }
  .history-date{
    font-family: var(--font-mono);
    color: var(--paper-dim);
    font-size: 11px;
    flex-shrink:0;
    width: 78px;
  }
  .history-data{ flex:1; }
  .history-charge{ color: var(--gold); font-weight:600; }
  .history-note{ color: var(--paper-dim); font-size:12px; font-style: italic; }
  .history-del{
    background:none; border:none; color: var(--paper-dim);
    cursor:pointer; font-size: 16px; line-height:1; padding: 2px 6px;
    flex-shrink:0;
  }
  .history-del:hover{ color: var(--crimson); }
  .history-empty{
    color: var(--paper-dim);
    font-size: 12px;
    font-style: italic;
    padding: 6px 0;
  }

  .chart-wrap{
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 6px 4px;
    margin-bottom: 4px;
  }
  .chart-range{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--gold);
    text-align: right;
    padding: 4px 8px 0;
  }

  .toast{
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(120%);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-display);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 4px;
    transition: transform .25s ease;
    z-index: 50;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }

  .loading-line{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--paper-dim);
    padding: 20px 0;
  }

  @media (max-width: 480px){
    .log-form{ grid-template-columns: repeat(2, 1fr); }
    .tab{ font-size: 11px; padding: 9px 4px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
(function(){
  const { useState, useEffect, useCallback, createElement: h } = React;

  const SESSIONS = [
    {
      id: 's1',
      label: 'Jambes',
      title: 'Séance 1 — Jambes',
      sub: 'Force max + explosivité bas du corps',
      exercises: [
        { id: 'squat', name: 'Squat (back squat / trap bar)', target: '4 x 4-5 · 80-85% 1RM' },
        { id: 'rdl', name: 'Soulevé de terre roumain', target: '3 x 6' },
        { id: 'fentes-bulg', name: 'Fentes bulgares', target: '3 x 8 / jambe' },
        { id: 'box-jump', name: 'Squat sauté / Box jump', target: '3 x 4' },
        { id: 'mollets', name: 'Mollets debout', target: '3 x 12' },
      ],
    },
    {
      id: 's2',
      label: 'Haut du corps',
      title: 'Séance 2 — Haut du corps',
      sub: 'Poussée / tirage + puissance de frappe',
      exercises: [
        { id: 'developpe', name: 'Développé couché / pompes lestées explosives', target: '4 x 5' },
        { id: 'rowing', name: 'Tirage horizontal (rowing)', target: '4 x 6-8' },
        { id: 'cable-rot', name: 'Rotation au câble (woodchop)', target: '4 x 8 / côté' },
        { id: 'kb-swing', name: 'Tirage vertical explosif (kettlebell swing)', target: '3 x 8' },
        { id: 'epaules', name: 'Développé militaire / élévations latérales', target: '3 x 8-10' },
      ],
    },
    {
      id: 's3',
      label: 'Gainage',
      title: 'Séance 3 — Gainage / Conditionnement',
      sub: 'Core spécifique boxe + finisher cardio',
      exercises: [
        { id: 'planche', name: 'Planche', target: '3 x 45s' },
        { id: 'pallof', name: 'Pallof press', target: '3 x 10 / côté' },
        { id: 'russian-twist', name: 'Russian twist lesté', target: '3 x 15 / côté' },
        { id: 'dead-bug', name: 'Dead bug', target: '3 x 10 / côté' },
        { id: 'mountain-climb', name: 'Mountain climbers', target: '3 x 20s' },
        { id: 'finisher', name: 'Finisher conditionnement (vélo/corde/sprint)', target: '6-8 x 30s effort / 30s repos' },
      ],
    },
  ];

  const STORAGE_KEY = 'training-logs-v1';

  // Couche de stockage adaptative : utilise window.storage si disponible (aperçu Claude),
  // sinon bascule sur localStorage (fichier exporté et ouvert/hébergé en dehors de Claude).
  const Storage = {
    hasClaudeStorage: typeof window.storage !== 'undefined',
    async get(key){
      if (this.hasClaudeStorage){
        try {
          const result = await window.storage.get(key, false);
          return result ? result.value : null;
        } catch (e){
          return null;
        }
      }
      try { return localStorage.getItem(key); } catch (e){ return null; }
    },
    async set(key, value){
      if (this.hasClaudeStorage){
        try { await window.storage.set(key, value, false); return true; }
        catch (e){ console.error('Erreur de sauvegarde', e); return false; }
      }
      try { localStorage.setItem(key, value); return true; }
      catch (e){ console.error('Erreur de sauvegarde', e); return false; }
    }
  };

  function todayStr(){
    return new Date().toISOString().slice(0,10);
  }

  function formatDateShort(d){
    const dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' });
  }

  function Toast({ message, show }){
    return h('div', { className: 'toast' + (show ? ' show' : '') }, message);
  }

  function ProgressChart({ entries }){
    const points = entries
      .filter(e => e.charge && !isNaN(parseFloat(e.charge)))
      .map(e => ({ date: e.date, value: parseFloat(e.charge) }))
      .sort((a,b) => a.date.localeCompare(b.date));

    if (points.length < 2){
      return h('div', { className: 'history-empty' }, 'Ajoute au moins 2 séances avec une charge chiffrée pour voir la courbe.');
    }

    const W = 320, H = 110, PAD = 24;
    const values = points.map(p => p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const xStep = (W - PAD * 2) / (points.length - 1);

    const coords = points.map((p, i) => ({
      x: PAD + i * xStep,
      y: H - PAD - ((p.value - min) / range) * (H - PAD * 2),
      ...p
    }));

    const pathD = coords.map((c, i) => (i === 0 ? 'M' : 'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');

    return h('div', { className: 'chart-wrap' },
      h('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, preserveAspectRatio: 'xMidYMid meet' },
        h('path', { d: pathD, fill: 'none', stroke: 'var(--crimson)', strokeWidth: 2, strokeLinejoin: 'round', strokeLinecap: 'round' }),
        coords.map((c, i) =>
          h('circle', { key: i, cx: c.x, cy: c.y, r: 3, fill: 'var(--gold)' })
        ),
        coords.length > 0 ? h('text', { x: coords[0].x, y: H - 6, fontSize: 9, fill: 'var(--paper-dim)', fontFamily: 'var(--font-mono)' }, formatDateShort(coords[0].date)) : null,
        coords.length > 1 ? h('text', { x: coords[coords.length-1].x, y: H - 6, fontSize: 9, fill: 'var(--paper-dim)', fontFamily: 'var(--font-mono)', textAnchor: 'end' }, formatDateShort(coords[coords.length-1].date)) : null,
        h('text', { x: coords[0].x, y: coords.reduce((m,c)=>c.y<m?c.y:m, H), fontSize: 0 }, '')
      ),
      h('div', { className: 'chart-range' }, `${min} \u2192 ${max} kg`)
    );
  }

  function ExerciseCard({ exo, entries, onAddEntry, onDeleteEntry }){
    const [open, setOpen] = useState(false);
    const [date, setDate] = useState(todayStr());
    const [charge, setCharge] = useState('');
    const [reps, setReps] = useState('');
    const [sets, setSets] = useState('');
    const [note, setNote] = useState('');

    const sorted = [...entries].sort((a,b) => b.date.localeCompare(a.date));
    const last = sorted[0];

    const canSave = charge.trim() !== '' || reps.trim() !== '' || note.trim() !== '';

    function handleSave(){
      if (!canSave) return;
      onAddEntry(exo.id, { date, charge: charge.trim(), reps: reps.trim(), sets: sets.trim(), note: note.trim() });
      setCharge(''); setReps(''); setSets(''); setNote('');
    }

    return h('div', { className: 'exo-card' + (open ? ' open' : '') },
      h('div', { className: 'exo-head', onClick: () => setOpen(!open) },
        h('div', null,
          h('div', { className: 'exo-name' }, exo.name),
          h('div', { className: 'exo-target' }, exo.target)
        ),
        h('div', { style: { display:'flex', alignItems:'center', gap:'10px' } },
          last ? h('div', { className: 'exo-last' }, (last.charge ? last.charge + ' kg' : '') + (last.charge && last.reps ? ' · ' : '') + (last.reps ? last.reps + ' reps' : '')) : null,
          h('svg', { className: 'chevron', width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2 },
            h('path', { d: 'M6 9l6 6 6-6' })
          )
        )
      ),
      h('div', { className: 'exo-body' },
        h('div', { className: 'log-form' },
          h('div', { className: 'field' },
            h('label', null, 'Date'),
            h('input', { type:'date', value: date, onChange: e => setDate(e.target.value) })
          ),
          h('div', { className: 'field' },
            h('label', null, 'Charge (kg)'),
            h('input', { type:'text', inputMode:'decimal', placeholder:'ex. 80', value: charge, onChange: e => setCharge(e.target.value) })
          ),
          h('div', { className: 'field' },
            h('label', null, 'Séries x reps'),
            h('input', { type:'text', placeholder:'ex. 4x5', value: reps, onChange: e => setReps(e.target.value) })
          ),
          h('div', { className: 'field' },
            h('label', null, 'RPE / ressenti'),
            h('input', { type:'text', placeholder:'ex. 8/10', value: sets, onChange: e => setSets(e.target.value) })
          ),
          h('div', { className: 'field full' },
            h('label', null, 'Note'),
            h('textarea', { placeholder:'Technique, douleur, sensation...', value: note, onChange: e => setNote(e.target.value) })
          )
        ),
        h('button', { className: 'btn-save', onClick: handleSave, disabled: !canSave }, 'Enregistrer'),

        h('div', { className: 'history' },
          h('div', { className: 'history-title' }, 'Progression de charge'),
          h(ProgressChart, { entries })
        ),

        h('div', { className: 'history' },
          h('div', { className: 'history-title' }, `Historique (${sorted.length})`),
          sorted.length === 0
            ? h('div', { className: 'history-empty' }, 'Aucune séance enregistrée pour cet exercice.')
            : sorted.map(entry =>
                h('div', { className: 'history-row', key: entry.id },
                  h('div', { className: 'history-date' }, formatDateShort(entry.date)),
                  h('div', { className: 'history-data' },
                    h('span', null,
                      entry.charge ? h('span', { className: 'history-charge' }, entry.charge + ' kg ') : null,
                      entry.reps ? entry.reps + ' ' : '',
                      entry.sets ? '· RPE ' + entry.sets : ''
                    ),
                    entry.note ? h('div', { className: 'history-note' }, entry.note) : null
                  ),
                  h('button', { className: 'history-del', onClick: () => onDeleteEntry(exo.id, entry.id), 'aria-label': 'Supprimer' }, '×')
                )
              )
        )
      )
    );
  }

  function exportData(logs){
    const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'suivi-boxe-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function App(){
    const [activeSession, setActiveSession] = useState('s1');
    const [logs, setLogs] = useState(null); // null = loading
    const [toast, setToast] = useState({ message:'', show:false });

    useEffect(() => {
      let cancelled = false;
      (async () => {
        const raw = await Storage.get(STORAGE_KEY);
        if (!cancelled) {
          try { setLogs(raw ? JSON.parse(raw) : {}); }
          catch (e) { setLogs({}); }
        }
      })();
      return () => { cancelled = true; };
    }, []);

    const persist = useCallback(async (next) => {
      setLogs(next);
      await Storage.set(STORAGE_KEY, JSON.stringify(next));
    }, []);

    const showToast = (message) => {
      setToast({ message, show: true });
      setTimeout(() => setToast(t => ({ ...t, show: false })), 1600);
    };

    const addEntry = (exoId, entry) => {
      const next = { ...logs };
      const list = next[exoId] ? [...next[exoId]] : [];
      list.push({ ...entry, id: Date.now() + '-' + Math.random().toString(36).slice(2,7) });
      next[exoId] = list;
      persist(next);
      showToast('Séance enregistrée');
    };

    const deleteEntry = (exoId, entryId) => {
      const next = { ...logs };
      next[exoId] = (next[exoId] || []).filter(e => e.id !== entryId);
      persist(next);
    };

    const session = SESSIONS.find(s => s.id === activeSession);

    return h('div', { className: 'wrap' },
      h('div', { className: 'masthead' },
        h('div', { className: 'eyebrow' }, 'Carnet d\u2019entra\u00eenement \u2014 PPG Boxe'),
        h('h1', null, 'Suivi de charges'),
        h('div', { className: 'sub' }, 'Programme 3 s\u00e9ances/semaine \u2014 entre les charges, note la technique, le ressenti, et laisse le carnet faire le reste.'),
        logs && Object.keys(logs).length > 0
          ? h('button', { className: 'btn-export', onClick: () => exportData(logs) }, 'Exporter mes données (.json)')
          : null
      ),
      h('div', { className: 'tabs' },
        SESSIONS.map(s =>
          h('div', {
            key: s.id,
            className: 'tab' + (activeSession === s.id ? ' active' : ''),
            onClick: () => setActiveSession(s.id)
          }, s.label)
        )
      ),
      session && h('div', { className: 'session-meta' },
        h('div', null,
          h('h2', null, session.title),
          h('div', { className: 'exo-target', style:{marginTop:'4px'} }, session.sub)
        ),
        h('div', { className: 'session-count' }, session.exercises.length + ' exercices')
      ),
      logs === null
        ? h('div', { className: 'loading-line' }, 'Chargement du carnet...')
        : session.exercises.map(exo =>
            h(ExerciseCard, {
              key: exo.id,
              exo,
              entries: logs[exo.id] || [],
              onAddEntry: addEntry,
              onDeleteEntry: deleteEntry,
            })
          ),
      h(Toast, { message: toast.message, show: toast.show })
    );
  }

  ReactDOM.createRoot(document.getElementById('app-root')).render(h(App));
})();
</script>
